[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "SciType"
version = "0.6.0"
description = "A Chinese-first scientific symbol abbreviation parser."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.11.1"]
build = [
    "PyInstaller==6.21.0",
    "PySide6-Essentials==6.11.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitype = ["data/*.json"]
